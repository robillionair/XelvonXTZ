name = "xelvon-xpt-backend"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
ADMIN_KEY = "robillionair"

# To enable Cloudflare KV storage:
# Create a KV namespace in the Cloudflare Dashboard (or via: npx wrangler kv:namespace create XELVON_EMAILS)
# Then bind it under your project Settings -> Variables and Secrets -> KV namespace bindings with variable name XELVON_EMAILS
# Or uncomment below and add your namespace ID:
# [[kv_namespaces]]
# binding = "XELVON_EMAILS"
# id = "<YOUR_PRODUCTION_KV_NAMESPACE_ID>"
